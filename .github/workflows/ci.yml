name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check source encoding
        run: python scripts/check_encoding.py

      - name: Run unittest suite
        env:
          PYTHONIOENCODING: utf-8
        run: python -B -m unittest discover -s tests/backend -p "test_*.py" -v

  frontend:
    name: Frontend tests and typecheck
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup pnpm
        shell: powershell
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc -p frontend/tsconfig.json --noEmit

      - name: Vitest
        run: pnpm test:frontend

      - name: Build
        run: pnpm exec vite build --config frontend/vite.config.ts
