name: CI

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check source encoding
        run: python scripts/check_encoding.py

      - name: Run unittest suite
        env:
          PYTHONIOENCODING: utf-8
        run: python -B -m unittest discover -s tests/backend -p "test_*.py"

  frontend:
    name: Frontend tests, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc -p frontend/tsconfig.json --noEmit

      - name: Vitest
        run: pnpm test:frontend

      - name: Build
        run: pnpm exec vite build --config frontend/vite.config.ts
