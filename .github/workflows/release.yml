name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, for example v1.0.1"
        required: true
        type: string
      target_ref:
        description: "Branch, tag, or commit to release"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-portable:
    name: Build Windows portable package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}
          fetch-depth: 0

      - name: Resolve release tag
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}".Trim()
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".Trim()
          } else {
            git fetch --tags origin
            $stableTags = git tag --list "v*.*.*" | ForEach-Object {
              if ($_ -match '^v(\d+)\.(\d+)\.(\d+)$') {
                [PSCustomObject]@{
                  Name = $_
                  Major = [int]$Matches[1]
                  Minor = [int]$Matches[2]
                  Patch = [int]$Matches[3]
                }
              }
            } | Sort-Object Major, Minor, Patch -Descending
            $latest = $stableTags | Select-Object -First 1
            if ($latest) {
              $version = "v$($latest.Major).$($latest.Minor).$($latest.Patch + 1)"
            } else {
              $version = "v1.0.0"
            }
            while (@(git tag --list $version).Count -gt 0) {
              if ($version -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
                throw "Cannot increment generated release tag: $version"
              }
              $version = "v$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)"
            }
          }
          if ($version -notmatch '^v\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Release version must look like v1.2.3 or v1.2.3-beta.1. Got: $version"
          }
          $targetSha = git rev-parse HEAD
          "RELEASE_TAG=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TARGET_SHA=$targetSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup pnpm
        shell: powershell
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate
          pnpm --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build portable app
        run: pnpm package:windows

      - name: Create release archive
        shell: powershell
        run: |
          $version = $env:RELEASE_TAG
          $zip = "release/bilibili-comment-danmaku-tool-windows-x64-$version.zip"
          Compress-Archive -Path "release/bilibili-comment-danmaku-tool/*" -DestinationPath $zip -Force
          "RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-comment-danmaku-tool-windows-x64-${{ env.RELEASE_TAG }}
          path: ${{ env.RELEASE_ZIP }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_TARGET_SHA }}
          files: ${{ env.RELEASE_ZIP }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          body: |
            Windows x64 portable build.

            Download the zip, extract it, then run `bilibili-comment-danmaku-tool.exe`.
            Local data, cookies, and logs are stored next to the exe in `data/` and `logs/`.
