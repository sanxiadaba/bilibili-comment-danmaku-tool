name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, for example v1.0.3"
        required: true
        type: string
      target_ref:
        description: "Branch, tag, or commit to release"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-portable:
    name: Build Windows portable package
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}

      - name: Resolve release tag
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}".Trim()
          } else {
            $version = "${{ github.ref_name }}".Trim()
          }
          if ($version -notmatch '^v\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Release version must look like v1.2.3 or v1.2.3-beta.1. Got: $version"
          }
          "RELEASE_TAG=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build portable app
        run: pnpm package:windows

      - name: Create release archive
        shell: powershell
        run: |
          $version = $env:RELEASE_TAG
          $zip = "release/bilibili-comment-danmaku-tool-windows-x64-$version.zip"
          Compress-Archive -Path "release/bilibili-comment-danmaku-tool/*" -DestinationPath $zip -Force
          "RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.RELEASE_ZIP }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          body: |
            Windows x64 portable build.

            Download the zip, extract it, then run `bilibili-comment-danmaku-tool.exe`.
            Local data, cookies, and logs are stored next to the exe in `data/` and `logs/`.
