name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-portable:
    name: Build Windows portable package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup pnpm
        shell: powershell
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate
          pnpm --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build portable app
        run: pnpm package:windows

      - name: Create release archive
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}"
          $zip = "release/bilibili-comment-danmaku-tool-windows-x64-$version.zip"
          Compress-Archive -Path "release/bilibili-comment-danmaku-tool/*" -DestinationPath $zip -Force
          "RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_ZIP }}
          generate_release_notes: true
          body: |
            Windows x64 portable build.

            Download the zip, extract it, then run `bilibili-comment-danmaku-tool.exe`.
            Local data, cookies, and logs are stored next to the exe in `data/` and `logs/`.
